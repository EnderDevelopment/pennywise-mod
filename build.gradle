plugins {
    id 'net.minecraftforge.gradle' version '5.1.85'
    id 'maven-publish'
}

group 'com.bd3194345'
version '1.0'

repositories {
    mavenCentral()
    maven {
        url = 'https://files.minecraftforge.net/maven'
    }
}

forge {
    version = '1.18.2-40.1.0'
    runs {
        client {
            property 'forge.logging.markers', 'REGISTRIES'
        }
        server {
            property 'forge.logging.markers', 'REGISTRIES'
        }
        data {
            property 'forge.logging.markers', 'REGISTRIES'
        }
    }
}

dependencies {
    implementation fg.deobf('com.mojang:patchy:1.1.11')
    implementation fg.deobf('org.ow2.asm:asm:9.2')
    implementation fg.deobf('org.ow2.asm:asm-commons:9.2')
    implementation fg.deobf('org.ow2.asm:asm-tree:9.2')
    implementation fg.deobf('org.ow2.asm:asm-analysis:9.2')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'META-INF/mods.toml'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
}

jar {
    from {
        configurations.compileClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}
